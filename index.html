<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Lihat portfolio Saddam Saktya Sandytia, Site Engineer dan Quality Control, sebagai presentasi slide.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Portfolio – Saddam Saktya Sandytia">
  <meta property="og:description" content="Portfolio Saddam Saktya Sandytia: pengalaman, proyek, keterampilan, dan sertifikat.">
  <meta property="og:image" content="/image/Slide%201.png">

  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <main class="viewer" aria-label="Portfolio slide viewer">
    <section
      class="carousel"
      id="carousel"
      role="region"
      aria-label="Portfolio, 13 slide"
      aria-roledescription="carousel"
      tabindex="0"
    ></section>
    <button class="side-nav side-nav--previous" type="button" data-action="previous" aria-label="Slide sebelumnya">
      <span aria-hidden="true">←</span>
    </button>
    <button class="side-nav side-nav--next" type="button" data-action="next" aria-label="Slide berikutnya">
      <span aria-hidden="true">→</span>
    </button>
    <p class="viewer-status" id="viewer-status" role="status" aria-live="polite" hidden></p>
  </main>

  <footer class="control-bar" aria-label="Kontrol portfolio">
    <div
      class="progress-track"
      id="progress-track"
      role="progressbar"
      aria-label="Progres presentasi"
      aria-valuemin="1"
      aria-valuemax="13"
      aria-valuenow="1"
    >
      <span class="progress-value" id="progress-value"></span>
    </div>
    <a class="footer-name" href="#1" data-slide="1">Saddam Saktya Sandytia</a>
    <nav class="slide-controls" aria-label="Navigasi slide">
      <button class="control-button" type="button" data-action="previous" aria-label="Slide sebelumnya">
        <span aria-hidden="true">←</span>
      </button>
      <output class="slide-counter" id="slide-counter" aria-live="polite">1 / 13</output>
      <button class="control-button" type="button" data-action="next" aria-label="Slide berikutnya">
        <span aria-hidden="true">→</span>
      </button>
    </nav>
    <nav class="contact-links" aria-label="Kontak">
      <a href="https://wa.me/6282134704526" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      <a href="mailto:saddamsandytia@gmail.com">Email</a>
      <a href="https://linkedin.com/in/saddamsandytia/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </nav>
    <button
      class="fullscreen-button"
      type="button"
      data-action="fullscreen"
      aria-label="Layar penuh"
      title="Layar penuh"
    >
      <svg aria-hidden="true" viewBox="0 0 20 20" fill="none">
        <path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4" />
      </svg>
      <span class="fullscreen-label">Layar penuh</span>
    </button>
  </footer>
